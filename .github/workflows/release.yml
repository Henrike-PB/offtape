# Release: quando uma tag vX.Y.Z é enviada, publica a release no GitHub com as
# notas da seção [X.Y.Z] do CHANGELOG.md.
#
# A versão continua sendo decisão do mantenedor (SemVer): o CHANGELOG é escrito
# à mão e a tag é criada por ele. Este workflow só elimina o passo manual de
# copiar as notas para a página de releases. Processo completo em
# docs/PLANO_GCS.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # necessário para criar a release

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código (com histórico, para conferir a main)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Conferir que a tag está na main
        # Toda release sai de um commit que já passou por PR e CI na main.
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::A tag $GITHUB_REF_NAME não aponta para um commit da main."
            exit 1
          fi

      - name: Extrair as notas do CHANGELOG
        run: python .github/scripts/notas_release.py "$GITHUB_REF_NAME" > notas.md

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Offtape $GITHUB_REF_NAME" \
            --notes-file notas.md \
            --verify-tag
