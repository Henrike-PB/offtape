# Dependabot: abre PRs semanais com atualizações das dependências.
# Cada PR passa pela CI antes do merge, como qualquer outra mudança.
#
# Observação: o yt-dlp não tem teto de versão no requirements.txt, de propósito
# (o YouTube muda sempre e só as versões novas funcionam). Por isso o Dependabot
# não abre PR para ele; quem usa atualiza com `pip install -U yt-dlp`.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
